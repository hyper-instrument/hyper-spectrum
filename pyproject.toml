[project]
name = "hyperspectrum"
version = "0.1.0"
description = "Contracts and runtime for scientific spectroscopy agents"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = [
    "pydantic>=2.8,<3",
    "typer>=0.12,<1",
    "click>=8.1,<9",
    "numpy>=2,<3",
    "scipy>=1.13,<2",
    "pyyaml>=6,<7",
    "jsonschema>=4.23,<5",
]

[build-system]
requires = ["uv_build==0.10.10"]
build-backend = "uv_build"

[project.scripts]
hyperspectrum = "hyperspectrum.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "types-pyyaml>=6.0.12.20260724",
    "types-jsonschema>=4.26.0.20260518",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.uv]
package = true

[tool.ruff]
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
follow_imports_for_stubs = true

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*", "scipy", "scipy.*"]
follow_imports = "skip"
ignore_missing_imports = true
