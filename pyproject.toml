[project]
name = "hyperspectrum"
version = "0.1.0"
description = "Contracts and runtime for scientific spectroscopy agents"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.8,<3",
    "typer>=0.12,<1",
    "numpy>=2,<3",
    "scipy>=1.13,<2",
    "pyyaml>=6,<7",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
